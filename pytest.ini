[pytest]
addopts = --import-mode=importlib
markers =
    sqlalchemy: exercises the SQLAlchemy repository backend (skipped when sqlalchemy is not installed)
    migration: runs Alembic migrations against a disposable Postgres (requires CREATIVELIFT_MIGRATION_TEST_DATABASE_URL)
pythonpath =
    apps/api
    services/experiment-engine
    services/bandit-service
    services/uplift-service
    services/mmm-service
    packages/sdk-python
testpaths =
    apps/api/tests
    services/experiment-engine/tests
    services/bandit-service/tests
    services/uplift-service/tests
    services/mmm-service/tests
    packages/sdk-python/tests
    connectors
