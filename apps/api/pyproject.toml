[project]
name = "creativelift-api"
version = "0.1.0"
description = "FastAPI backend for CreativeLift AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "sqlalchemy: exercises the SQLAlchemy repository backend (skipped when sqlalchemy is not installed)",
  "migration: runs Alembic migrations against a disposable Postgres (requires CREATIVELIFT_MIGRATION_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
