services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creativelift
      POSTGRES_USER: creativelift
      POSTGRES_PASSWORD: creativelift_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativelift -d creativelift"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Repo-root context so the image can install services/* used by the API.
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://creativelift:creativelift_dev@postgres:5432/creativelift
      REDIS_URL: redis://redis:6379/0
      # Docker is the documented persistent profile; the bare quickstart stays in-memory.
      RESOURCE_REPOSITORY_BACKEND: sqlalchemy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
